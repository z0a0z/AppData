name: Build AppData DEB

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Tools & MonkeyDev Mock
        run: |
          brew install dpkg ldid
          
          # إنشاء بيئة وهمية لـ MonkeyDev لتخطي سكربتات Xcode
          sudo mkdir -p /opt/MonkeyDev/bin
          sudo tee /opt/MonkeyDev/bin/md > /dev/null << 'EOF'
          #!/bin/bash
          exit 0
          EOF
          sudo chmod +x /opt/MonkeyDev/bin/md

      - name: Compile Project
        run: |
          xcodebuild clean build \
            -project AppData.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Rootful Package
        run: |
          mkdir -p packages stage-rootful/DEBIAN
          mkdir -p stage-rootful/Library/MobileSubstrate/DynamicLibraries
          mkdir -p stage-rootful/Library/PreferenceBundles

          cp -r PackageInfo/* stage-rootful/DEBIAN/
          find build -name "*.dylib" -exec cp {} stage-rootful/Library/MobileSubstrate/DynamicLibraries/ \;
          find . -maxdepth 3 -name "AppData.plist" -not -path "./build/*" -exec cp {} stage-rootful/Library/MobileSubstrate/DynamicLibraries/ \;
          find build -name "*.bundle" -exec cp -r {} stage-rootful/Library/PreferenceBundles/ \;

          find stage-rootful -name "*.dylib" -exec ldid -S {} \;
          dpkg-deb -b -Zgzip stage-rootful packages/com.fouadraheb.appdata_rootful.deb

      - name: Build Rootless Package (iOS 15+)
        run: |
          mkdir -p stage-rootless/DEBIAN
          mkdir -p stage-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p stage-rootless/var/jb/Library/PreferenceBundles

          cp -r PackageInfo/* stage-rootless/DEBIAN/
          sed -i '' 's/iphoneos-arm/iphoneos-arm64/g' stage-rootless/DEBIAN/control

          find build -name "*.dylib" -exec cp {} stage-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries/ \;
          find . -maxdepth 3 -name "AppData.plist" -not -path "./build/*" -exec cp {} stage-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries/ \;
          find build -name "*.bundle" -exec cp -r {} stage-rootless/var/jb/Library/PreferenceBundles/ \;

          find stage-rootless -name "*.dylib" -exec ldid -S {} \;
          dpkg-deb -b -Zgzip stage-rootless packages/com.fouadraheb.appdata_rootless.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppData-Packages
          path: packages/*.deb
