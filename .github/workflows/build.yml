name: Build AppData DEB

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: theos/action-setup-theos@master

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          cp -r sdks-master/iPhoneOS14.5.sdk $THEOS/sdks/ 2>/dev/null || cp -r sdks-master/iPhoneOS*.sdk $THEOS/sdks/
          rm -rf master.zip sdks-master

      - name: Build Rootless Package (Dopamine / iOS 15+)
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Build Rootful Package (Legacy)
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppData-Packages
          path: packages/*.deb
